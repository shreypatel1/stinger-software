navsat_transform_node:
    ros__parameters:
        magnetic_declination_radians: 0.0
        yaw_offset: 0.0
        zero_altitude: false
        publish_filtered_gps: true
        use_odometry_yaw: false
        # Use a local Cartesian projection for converting lat/lon -> x/y.
        # This is simpler for bringup and avoids external datum lookups.
        use_local_cartesian: true
        frequency: 30.0
